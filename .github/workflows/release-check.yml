name: Release qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supported-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROVIDERS: offline
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Diagnose Windows ACL prerequisites on synthetic state
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const cp = require('node:child_process');
          const source = fs.readFileSync('packages/integrations/src/private-state.ts', 'utf8');
          const script = source.split('const windowsAcl = String.raw`')[1].split('`')[0];
          const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'atflows-acl-ci-'));
          try {
            cp.execFileSync(path.join(process.env.SystemRoot, 'System32/WindowsPowerShell/v1.0/powershell.exe'),
              ['-NoProfile', '-NonInteractive', '-EncodedCommand', Buffer.from(script, 'utf16le').toString('base64')],
              {env: {...process.env, ATFLOWS_PRIVATE_TARGETS: JSON.stringify([directory]), ATFLOWS_PRIVATE_ACTION: 'protect'}, stdio: 'inherit'});
          } finally { fs.rmSync(directory, {recursive: true, force: true}); }
          JS
      - run: bun run test
      - run: bun run --filter @atflows/dashboard test
      - run: bun run typecheck
      - run: bun run build
      - run: python -m pip install pytest build twine
      - run: python -m pytest -q tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Browser qualification
        if: runner.os == 'Linux'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
