name: Release qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supported-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROVIDERS: offline
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run --filter @atflows/dashboard test
      - run: bun run typecheck
      - run: bun run build
      - run: python -m pip install pytest build twine
      - run: python -m pytest -q tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Browser qualification
        if: runner.os == 'Linux'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
