<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M12 6.5 L5.5 17.5 M12 6.5 L18.5 17.5' stroke='%231F777C' stroke-width='1.4' stroke-linecap='round'/><circle cx='12' cy='5' r='2.6' fill='%231F777C'/><circle cx='5' cy='18.5' r='2.2' stroke='%231F777C' stroke-width='1.4'/><circle cx='19' cy='18.5' r='2.2' stroke='%231F777C' stroke-width='1.4'/></svg>"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AtMem.ai | AtFlows</title>
        <script>
            // Apply theme immediately to prevent flash
            ;(function () {
                const saved = localStorage.getItem('atflows-theme')
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark')
                }
            })()
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
