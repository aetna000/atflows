[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atflows"
version = "0.1b5"
description = "AtFlows: local LLM observability, tracing and cost tracking"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSE-MIT-LLMFLOW", "NOTICE"]
authors = [{ name = "Javad Taghia", email = "taghia.javad@gmail.com" }]
keywords = ["llm", "observability", "tracing", "opentelemetry", "cost-tracking"]

[project.scripts]
atflows = "atflows.cli:main"
atflow = "atflows.cli:main"

[project.urls]
Homepage = "https://github.com/aetna000/atflows"
Repository = "https://github.com/aetna000/atflows"
Upstream = "https://github.com/HelgeSverre/llmflow"

[tool.setuptools]
packages = ["atflows"]
include-package-data = true
